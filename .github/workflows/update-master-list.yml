name: Update master list

on:
  push:
    branches: [main]
    paths: ['docs/**/*.md']

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Required so git diff HEAD~1 HEAD works

      - name: Update master list with new rulesheets
        run: python scripts/update_master_list.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-update master list"
            git push
          fi
